# Demo branch BR0002. A different back-office with numeric category codes (C01, C02, ...) and tender codes (T1, T2, ...)
name: branch-br0002

services:
  branch-db:
    ports:
      # This machine only: demo-branches/sql.sh stands in for the back-office system
      - "127.0.0.1:5435:5432"
  kafka:
    environment:
      # Kafka cluster id of this branch's broker (any 16 bytes, base64url)
      CLUSTER_ID: 9XgwKUCFRS6UXZ0Fh4zEVA
      KAFKA_ADVERTISED_LISTENERS: LOCAL://kafka:19092,EXTERNAL://kafka.br0002.example:9094
    volumes:
      # Broker key + certificate for kafka.br0002.example, from HQ (onboard-branch.sh)
      - ${BR0002_KAFKA_PEM:?set BR0002_KAFKA_PEM in .env}:/etc/kafka/tls/kafka.pem:ro
  kafka-init:
    environment:
      # HQ's password at this broker, the same value HQ used in onboard-branch.sh
      HQ_KAFKA_PASSWORD: ${BR0002_HQ_KAFKA_PASSWORD:?set BR0002_HQ_KAFKA_PASSWORD in .env}
  edge:
    networks:
      wan:
        aliases:
          - kafka.br0002.example
  producer:
    volumes:
      - ./demo-branches/BR0002/branch.yaml:/config/branch.yaml:ro
    ports:
      # Health and metrics of this branch's producer, this machine only
      - "127.0.0.1:8092:8080"
    environment:
      # Demo only: a round every minute with up to 15 s delay, instead of every hour with up to 30 min
      SEND_CRON: "0 * * * * *"
      SEND_MAX_JITTER: 15s
      # The demo days are fixed dates (2026-10-01 ...); read them however long ago that is. The retention must be
      # longer than the lookback (the producer refuses to start otherwise)
      SEND_LOOKBACK: 3650d
      SEND_STATE_RETENTION: 3700d

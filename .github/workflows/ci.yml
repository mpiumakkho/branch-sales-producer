name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Unit tests and Testcontainers tests on all three branch databases, with Kafka and MongoDB (Docker on the runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  branch:
    # The branch stack from docker-compose.yml (Kafka with TLS + SCRAM, kafka-init, edge), checked by the smoke test
    # from the wan network as HQ connects. Stands in for HQ's onboarding with a CA and certificate created here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: CA and broker certificate (as HQ's onboard-branch.sh creates them)
        run: |
          mkdir -p ci-tls && cd ci-tls
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj "/CN=ci CA" -keyout ca.key -out ca.crt
          openssl req -newkey rsa:3072 -nodes -subj "/CN=kafka.br0001.example" -keyout kafka.key -out kafka.csr
          printf 'subjectAltName=DNS:kafka.br0001.example\nextendedKeyUsage=serverAuth\n' > kafka.ext
          openssl x509 -req -in kafka.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile kafka.ext -out kafka.crt
          openssl pkcs8 -topk8 -nocrypt -in kafka.key -out kafka.p8
          cat kafka.p8 kafka.crt ca.crt > kafka.pem
          chmod 644 kafka.pem
      - name: Configure
        run: |
          docker network create branch-sales-wan
          cat > .env <<EOF
          BRANCH_DB_PASSWORD=ci-$GITHUB_RUN_ID
          BRANCH_READER_PASSWORD=ci-$GITHUB_RUN_ID
          MONGO_ROOT_PASSWORD=ci-$GITHUB_RUN_ID
          MONGO_PASSWORD=ci-$GITHUB_RUN_ID
          BR0001_HQ_KAFKA_PASSWORD=ci-hq-$GITHUB_RUN_ID
          BR0001_KAFKA_PEM=./ci-tls/kafka.pem
          BR0002_HQ_KAFKA_PASSWORD=unused
          BR0002_KAFKA_PEM=./ci-tls/kafka.pem
          EOF
      - name: Start the branch Kafka, kafka-init and edge
        run: |
          docker compose -f docker-compose.yml -f demo/BR0001.compose.yaml up -d kafka-init edge
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' branch-br0001-kafka-init-1 2>/dev/null || true)
            [[ "$state" == "exited 0" ]] && break
            [[ "$state" == exited* ]] && { docker compose -f docker-compose.yml -f demo/BR0001.compose.yaml logs kafka kafka-init; exit 1; }
            sleep 5
          done
          [[ "$state" == "exited 0" ]] || { docker compose -f docker-compose.yml -f demo/BR0001.compose.yaml logs; exit 1; }
      - run: HQ_KAFKA_PASSWORD=ci-hq-$GITHUB_RUN_ID ./smoke-test.sh BR0001 ci-tls/ca.crt
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f demo/BR0001.compose.yaml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f demo/BR0001.compose.yaml down -v

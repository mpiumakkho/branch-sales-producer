# Demo branch BR0001. Back-office category codes: BEV, SNK, RTE, HH
name: branch-br0001

services:
  branch-db:
    ports:
      - "5434:5432"
  producer:
    volumes:
      - ./demo/BR0001/branch.yaml:/config/branch.yaml:ro
    environment:
      # Demo only: a round every minute with up to 15 s delay, instead of every hour with up to 30 min
      SEND_CRON: "0 * * * * *"
      SEND_MAX_JITTER: 15s
      # SCRAM password of user BR0001, the same value HQ used in onboard-branch.sh
      KAFKA_PASSWORD: ${BR0001_KAFKA_PASSWORD:?set BR0001_KAFKA_PASSWORD in .env}

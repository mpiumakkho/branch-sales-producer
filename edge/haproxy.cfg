# Branch edge: stands in for the branch firewall / port forward. It is the only branch container on the wan network
# and forwards one TCP port, 9094, to the broker's EXTERNAL listener, where HQ connects. TLS is not terminated here:
# it runs end to end between HQ and the broker, so the edge never sees passwords or data.
global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # HQ keeps its connections open between polls
    timeout client 1h
    timeout server 1h

frontend kafka_external
    bind :9094
    default_backend kafka

backend kafka
    # Resolved through Docker DNS at runtime, so a recreated Kafka container with a new IP is found again
    server kafka kafka:9094 resolvers docker init-addr none check
